[package]
name = "tx-sender"
version = "0.1.0"
edition = "2021"

[dependencies]
low-latency-utils = { path = "../low-latency-utils" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
base64-simd = "0.8"
arrayvec = "0.7"
libc = "0.2"
core_affinity = "0.8"
quinn-proto = { version = "0.11", default-features = false, features = ["rustls-ring"] }
bytes = "1"
rcgen = "0.13"
io-uring = { version = "0.7", optional = true }
libtpa-sys = { path = "../libtpa-sys", optional = true }
crossbeam-channel = "0.5"
webpki-roots = "0.26"
dhat = { version = "0.3", optional = true }
solana-sdk = { version = "3", optional = true }
solana-system-interface = { version = "2", optional = true }
solana-compute-budget-interface = { version = "3", optional = true }
solana-client = { version = "3", optional = true }
bincode = { version = "1.3", optional = true }
bs58 = { version = "0.5", optional = true }

[features]
default = ["registry", "io-uring"]
registry = []
io-uring = ["dep:io-uring"]
libtpa = ["dep:libtpa-sys"]
profiling = ["low-latency-utils/profiling"]
dhat-heap = ["dep:dhat"]
real-tx-example = [
    "dep:solana-sdk",
    "dep:solana-system-interface",
    "dep:solana-compute-budget-interface",
    "dep:solana-client",
    "dep:bincode",
    "dep:bs58",
]

[dev-dependencies]
quinn = { version = "0.11", default-features = false, features = ["rustls-ring", "runtime-tokio"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros"] }
criterion = { version = "0.5", features = ["html_reports"] }
dhat = "0.3"

[[example]]
name = "send_real_tx"
required-features = ["real-tx-example"]

[[bench]]
name = "trigger_submit"
harness = false

[[test]]
name = "dhat_zero_alloc"
path = "tests/dhat_zero_alloc.rs"
required-features = ["dhat-heap"]
